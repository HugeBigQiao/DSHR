[package]
name = "dshr-state"
version = "0.1.0"
edition.workspace = true

[dependencies]
dsh-sdk-client = { path = "../dsh-sdk-client" }
dsh-sdk-protocol = { path = "../dsh-sdk-protocol" }
# 加工库（DESIGN §11.2 事实表）：bundled = 编译内置 sqlite3（本机无 libsqlite3.so 开发库，
# 需要 cc/gcc；libsqlite3-sys 会拉入 sqlite3 官方 C 源码一并编译）。
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
