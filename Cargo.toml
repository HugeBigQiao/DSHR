[workspace]
resolver = "2"
members = [
    "dshr-protocol",
    "dshr-runtime",
    "dshr-state",
    "dshr-ui",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
iced = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
similar = "2"
