[workspace]
resolver = "2"
members = [
    "dshr-data",
    "dshr-protocol",
    "dshr-runtime",
    "dshr-state",
    "dshr-ui",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
dotenvy = "0.15"
iced = "0.14"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
