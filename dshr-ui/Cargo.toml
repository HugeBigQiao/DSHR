[package]
name = "dshr-ui"
version = "0.1.0"
edition.workspace = true

[dependencies]
# "advanced" feature：自定义 widget（覆盖式菜单 Popover）需要 iced::advanced；
# "canvas" feature：窗口控制图标自绘（— □ ✕ 统一大小）。
iced = { workspace = true, features = ["tokio", "advanced", "canvas"] }
serde = { workspace = true }
serde_json = { workspace = true }
# s3 真桥（DESIGN §11.4）：SDK 客户端（spawn/initialize/prompt/shutdown/事件订阅）+ 协议类型 +
# state 层（Folder 折叠 / config / runtime ensure）。UI 不依赖 store 落库（s2 已独立完成）。
dsh-sdk-client = { path = "../dsh-sdk-client" }
dsh-sdk-protocol = { path = "../dsh-sdk-protocol" }
dshr-state = { path = "../dshr-state" }
# iced "tokio" feature 自带 executor；worker 读循环/select 直接使用 tokio 类型（broadcast/select）。
tokio = { workspace = true }
