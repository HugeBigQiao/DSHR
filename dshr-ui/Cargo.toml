[package]
name = "dshr-ui"
version = "0.1.0"
edition.workspace = true

[dependencies]
# "advanced" feature：自定义 widget（覆盖式菜单 Popover）需要 iced::advanced；
# "canvas" feature：窗口控制图标自绘（— □ ✕ 统一大小）。
iced = { workspace = true, features = ["tokio", "advanced", "canvas"] }
serde = { workspace = true }
serde_json = { workspace = true }
# s3 真桥（DESIGN §11.4 / M3.6，2026-09 engine 下沉）：UI 只搬运命令/事件——
# BridgeCmd/BridgeEvent 来自 dshr_state::engine（engine 内完成 spawn/事件循环/
# fold→快照 + 落库 + WireLog），不再直接依赖 dsh-sdk-client/dsh-sdk-protocol。
dshr-state = { path = "../dshr-state" }
# iced "tokio" feature 自带 executor；bus 的命令通道用 tokio::sync::mpsc（engine
# 同款通道），bridge Ready 事件负载即 tokio mpsc Sender——保留直接依赖。
tokio = { workspace = true }
